AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 2.6

Metrics:
  Enabled: false

Style/GlobalVars:
  Enabled: false

# Native command APIs return success booleans; do not rename CLI operations.
Naming/PredicateMethod:
  Enabled: false

# Existing installer code; unrelated to boot environment activation.
Style/FileOpen:
  Exclude:
    - lib/nest/installer.rb
